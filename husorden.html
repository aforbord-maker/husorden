<title>Husorden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Righteous&family=Figtree:wght@400;500;600;700;800&family=Neonderthaw&display=swap">
<style>
/* Oppsett: én kolonne, maks 760 px. Sjakkbånd øverst, ukestripe, dagskort og lister, så sammenligning, ny oppgave og familien.
   Utseende: vaskerom-retningen, se docs/design.md. Variablene under er kopiert fra design/tokens.css. */
:root {
  /* Grunnfarger */
  --vegg: #FBF7F0;          /* bakgrunn i hele appen */
  --kort: #FFFFFF;          /* kort og lister */
  --blekk: #1A2227;         /* tekst, konturer, sjakkruter, harde skygger */
  --krom: #5E6A72;          /* dempet tekst (5,2:1 på --vegg) */

  /* Turkis */
  --skapturkis: #1FC1B8;    /* hovedfarge: primærknapper, valgt dag, avkrysset. Tekst på den: --blekk */
  --skiltturkis: #0B7A74;   /* skiltkant, lenker, seksjonstitler, piler (4,9:1 på --vegg) */

  /* Mint og aqua */
  --maskinmint: #8EE3C8;    /* ring på avkrysning, skiltramme, fremdrift */
  --skumaqua: #D2F4EE;      /* ferdige oppgaver, myke flater */
  --skiltmint: #B8F0DD;     /* fyll i skiltbokstaver */

  /* Rosa */
  --handklerosa: #F7A1B5;   /* skiltflate, barn, feiring. Tekst på den: --blekk */
  --lysrosa: #FFD9E1;       /* myke flater, barnechips */
  --skiltskygge: #E58A9B;   /* 3D-skygge i skiltbokstaver */

  /* Glitter og varsel */
  --glitter: #FFE45C;       /* stjerner, belønning */
  --kirsebaer: #B4233F;     /* slett / feil – i små doser */

  /* Neon – KUN på --natt, KUN til feiring */
  --natt: #141A22;
  --neon-rosa: #FF4FA3;
  --neon-turkis: #2FF3E0;
  --neon-gul: #FFE45C;

  /* Typografi */
  --font-skilt: "Anton", Impact, sans-serif;           /* logo/skilt-navn */
  --font-skilt-under: "Bebas Neue", Impact, sans-serif; /* skiltets undertekst, illustrasjonsnavn */
  --font-overskrift: "Righteous", system-ui, sans-serif; /* overskrifter, tall, seksjonstitler */
  --font-tekst: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; /* all brødtekst og UI */
  --font-neon: "Neonderthaw", cursive;                  /* bare neon-feiring */

  /* Form */
  --strek: 2px solid var(--blekk);
  --radius-kort: 22px;
  --radius-stor: 24px;
  --radius-pille: 999px;
  --skygge-knapp: 0 5px 0 var(--skiltturkis);    /* primærknapp */
  --skygge-knapp-sek: 0 5px 0 var(--maskinmint); /* sekundærknapp */
  --skygge-valgt: 0 4px 0 var(--skiltturkis);    /* valgt dag */

  /* Mønstre */
  --tapet: radial-gradient(var(--handklerosa) 1.3px, transparent 1.5px) 0 0 / 28px 28px,
           radial-gradient(var(--maskinmint) 1.3px, transparent 1.5px) 14px 14px / 28px 28px,
           var(--vegg);
  --sjakk: repeating-conic-gradient(var(--blekk) 0 25%, #FFFFFF 0 50%) 0 0 / 16px 16px;

  /* Neon-glød */
  --glod-rosa: 0 0 3px var(--neon-rosa), 0 0 10px var(--neon-rosa), 0 0 22px var(--neon-rosa);
  --glod-turkis: 0 0 3px var(--neon-turkis), 0 0 10px var(--neon-turkis);

  color-scheme: light; /* mørk modus designes senere */
}
body { background: var(--vegg); color: var(--blekk); font: 400 16px/1.45 var(--font-tekst); }
.checker { height: 16px; background: var(--sjakk); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-skilt); font-weight: 400; font-size: 2.25rem; line-height: 1.1; text-transform: uppercase; letter-spacing: .02em; display: flex; align-items: flex-start; gap: 6px; }
h2 { font-family: var(--font-overskrift); font-weight: 400; font-size: 22px; line-height: 1.2; letter-spacing: .02em; text-transform: uppercase; }
p { margin: 0; }
.muted { color: var(--krom); }
.small { font-size: .85rem; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--skiltturkis); outline-offset: 2px; }
.ico { display: inline-flex; flex: none; }
.ico svg { display: block; }

.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.tophead { background: var(--tapet); }
.topin { max-width: 800px; margin: 0 auto; box-sizing: border-box; padding-block: 22px 18px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.logo { flex: 0 1 210px; min-width: 0; }
.nav { display: flex; gap: 6px; flex: none; }
.ikonknapp { width: 44px; height: 44px; background: var(--kort); border: var(--strek); border-radius: 50%; display: grid; place-content: center; color: var(--blekk); flex: none; }
.ikonknapp:hover { background: var(--skumaqua); }
.btn { background: var(--kort); color: var(--blekk); border: var(--strek); border-radius: var(--radius-pille); padding: 8px 18px; min-height: 48px; min-width: 44px; font-weight: 700; display: inline-grid; place-content: center; box-shadow: var(--skygge-knapp-sek); margin-bottom: 5px; }
.btn:hover { background: var(--skumaqua); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--maskinmint); }
.btn.primary { background: var(--skapturkis); font-weight: 800; min-height: 52px; padding: 8px 22px; box-shadow: var(--skygge-knapp); }
.btn.primary:hover { background: var(--skapturkis); }
.btn.primary:active { box-shadow: 0 2px 0 var(--skiltturkis); }

.note { background: var(--lysrosa); border: var(--strek); border-radius: 14px; padding: 10px 14px; font-size: 14px; }

.week { list-style: none; margin: 0; padding: 0 0 4px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.daybtn { width: 100%; background: var(--kort); border: var(--strek); border-radius: var(--radius-pille); padding: 8px 0; min-height: 44px;
  display: flex; flex-direction: column; align-items: center; gap: 1px; font-variant-numeric: tabular-nums; }
.daybtn .abbr { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--krom); }
.daybtn .num { font-family: var(--font-overskrift); font-size: 19px; font-weight: 400; line-height: 1.1; }
.daybtn .cnt { font-size: 11px; color: var(--krom); }
.daybtn.today { border-width: 4px; padding: 6px 0; }
.daybtn[aria-pressed="true"] { background: var(--skapturkis); color: var(--blekk); box-shadow: var(--skygge-valgt); }
.daybtn[aria-pressed="true"] .abbr, .daybtn[aria-pressed="true"] .cnt { color: var(--blekk); font-weight: 700; }

.card { background: var(--kort); border: var(--strek); border-radius: var(--radius-stor); padding: 14px 16px; display: flex; align-items: center; gap: 16px; }
.daytxt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.daytxt p { font-size: 15px; }
.ring { width: 76px; height: 76px; flex: none; box-sizing: border-box; border-radius: 50%; border: var(--strek); display: grid; place-content: center;
  background: conic-gradient(var(--skapturkis) 0 var(--p, 0%), var(--skumaqua) 0 100%); }
.ringin { width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; background: var(--kort); border: var(--strek); display: grid; place-content: center;
  font-family: var(--font-overskrift); font-size: 18px; font-variant-numeric: tabular-nums; }
.ringin.lang { font-size: 14px; }
.bar { height: 16px; border: var(--strek); border-radius: var(--radius-pille); background: var(--skumaqua); overflow: hidden; display: flex; }
.bar > span { background: var(--skapturkis); border-right: var(--strek); transition: width .25s; }
.bar > span[data-zero] { border-right: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--kort); border: var(--strek); border-radius: var(--radius-pille); padding: 6px 14px; min-height: 44px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.chip.barn { background: var(--lysrosa); }
.chip[aria-pressed="true"] { background: var(--blekk); color: var(--kort); }

.day { display: flex; flex-direction: column; gap: 16px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group h3 { margin: 0; font: 400 16px/1.25 var(--font-overskrift); text-transform: uppercase; letter-spacing: .08em; color: var(--skiltturkis); }
.tasks { list-style: none; margin: 0; padding: 0; background: var(--kort); border: var(--strek); border-radius: var(--radius-kort); overflow: hidden; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 8px 14px; }
.tekst { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tekst .linjer { display: flex; flex-direction: column; min-width: 0; }
.miniikon { width: 44px; height: 44px; flex: none; display: block; }
.miniikon.tom { display: grid; place-content: center; border-radius: 12px; background: var(--kort); border: var(--strek); box-sizing: border-box; width: 40px; height: 40px; margin: 2px; }
.hoyre { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hoyre .who { max-width: 128px; text-overflow: ellipsis; }
.task + .task { border-top: var(--strek); }
.task.done { background: var(--skumaqua); }
.cb { appearance: none; -webkit-appearance: none; box-sizing: border-box; width: 32px; height: 32px; margin: 6px; border: 5px solid var(--maskinmint); border-radius: 50%; background: var(--kort); box-shadow: 0 0 0 2px var(--blekk); display: grid; place-content: center; cursor: pointer; flex: none; align-self: center; }
.cb:checked { background: var(--skapturkis); }
.cb:checked::after { content: ""; width: 10px; height: 5px; border-left: 3px solid var(--blekk); border-bottom: 3px solid var(--blekk); transform: translateY(-2px) rotate(-45deg); }
.task .title { font-weight: 700; font-size: 16px; overflow-wrap: break-word; hyphens: auto; cursor: pointer; }
.task .meta { font-size: 13px; color: var(--krom); font-variant-numeric: tabular-nums; }
.task.done .title { text-decoration: line-through; color: var(--krom); }
.ctl { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { border: 2px dashed var(--krom); background: transparent; color: var(--krom); border-radius: var(--radius-pille); padding: 2px 12px; font-size: 13px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; }
.tag[aria-pressed="true"] { background: var(--handklerosa); color: var(--blekk); border: var(--strek); font-weight: 800; }
.who { background: var(--kort); border: var(--strek); border-radius: var(--radius-pille); padding: 2px 10px; min-height: 44px; font-size: 13px; font-weight: 800; max-width: 100%; }
.who.adult { background: var(--kort); }
.who.kid { background: var(--handklerosa); }
.del { background: transparent; border: 0; color: var(--skiltturkis); font-size: 14px; font-weight: 700; padding: 4px 8px; min-height: 44px; min-width: 44px; border-radius: 12px; text-decoration: underline; }
.del.slett { color: var(--kirsebaer); }
.del.slett.sure { font-weight: 800; outline: 2px solid var(--kirsebaer); text-decoration: none; }
.tips { grid-column: 2 / -1; font-size: 14px; min-width: 0; }
.mer > summary { color: var(--krom); font-size: 13px; }
.mer[open] { padding-bottom: 6px; }
.tips summary { cursor: pointer; color: var(--skiltturkis); font-weight: 700; padding: 4px 0; width: fit-content; }
.tips summary { min-height: 44px; box-sizing: border-box; display: flex; align-items: center; }
.tips ol { margin: 2px 0 6px; padding: 10px 12px 10px 2.2em; display: flex; flex-direction: column; gap: 4px; max-width: 60ch; box-sizing: border-box; background: var(--lysrosa); border: var(--strek); border-radius: 14px; }
.tips p { margin: 6px 0; }
.tips .ctl { margin-top: 8px; }
textarea { background: var(--kort); border: var(--strek); border-radius: 14px; padding: 10px 12px; width: 100%; box-sizing: border-box; resize: vertical; }
.empty { color: var(--krom); padding: 16px; background: var(--kort); border: 2px dashed var(--blekk); border-radius: var(--radius-kort); }

.visning { display: flex; flex-direction: column; gap: 20px; }
.panel { display: flex; flex-direction: column; gap: 12px; background: var(--kort); border: var(--strek); border-radius: var(--radius-stor); padding: 16px; scroll-margin-top: 12px; }
.cmp { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.cmp li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.cmp .name { font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.cmp .val { font-size: .85rem; color: var(--krom); font-variant-numeric: tabular-nums; text-align: right; }
.cmp .bar { grid-column: 1 / -1; height: 20px; }
.cmp .bar > span.adult { background: var(--maskinmint); }
.cmp .bar > span.kid { background: var(--handklerosa); }
.cmp .bar > span.nobody { background: var(--kort); }
.lead { font-family: var(--font-overskrift); font-weight: 400; font-size: 18px; }

form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 14px; font-weight: 700; color: var(--krom); }
.field.grow { flex: 1 1 220px; }
.field.full { flex-basis: 100%; }
.field input[type="text"], .field input[type="number"], .field select { background: var(--kort); color: var(--blekk); border: var(--strek); border-radius: 14px; padding: 8px 12px; min-height: 48px; font-size: 1rem; font-weight: 400; width: 100%; box-sizing: border-box; }
.field textarea { color: var(--blekk); font-size: 1rem; font-weight: 400; }
.field.num { width: 90px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--blekk); font-size: .95rem; font-weight: 500; }
.check .cb { width: 28px; height: 28px; margin: 2px; border-width: 4px; grid-row: auto; align-self: center; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; flex-basis: 100%; }
legend { font-size: .85rem; font-weight: 600; color: var(--krom); padding: 0; margin-bottom: 4px; }
.people { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.person { display: flex; align-items: center; gap: 8px; background: var(--kort); border: var(--strek); border-radius: var(--radius-pille); padding: 0 6px 0 14px; font-weight: 800; }
.person.kid { background: var(--handklerosa); }
.person .role { font-size: .8rem; font-weight: 600; }
.person .del { color: var(--blekk); }

.sel { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--krom); max-width: 100%; }
.who.free { border-style: dashed; background: var(--lysrosa); }
.daytxt .free { font-weight: 700; background: var(--lysrosa); border: var(--strek); border-radius: 14px; padding: 4px 12px; width: fit-content; font-size: 14px; }
.del:disabled { opacity: .35; cursor: default; }
.kidlabel { align-self: center; font-size: .85rem; font-weight: 700; color: var(--krom); }
.chip.go { background: var(--lysrosa); }
.kidhead { background: var(--tapet); }
.kidin { position: relative; max-width: 760px; margin: 0 auto; padding-block: 26px 22px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.kidtilbake { position: absolute; top: 20px; right: max(20px, env(safe-area-inset-right, 0px)); }
.kidskilt { width: 290px; max-width: calc(100% - 56px); }
.starcard { background: var(--kort); border: var(--strek); border-radius: 20px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
.starcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.starrow { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.starcard .bar { height: 12px; }
.kcards { display: flex; flex-direction: column; gap: 14px; }
.kcard { position: relative; background: var(--kort); border: var(--strek); border-radius: var(--radius-stor); padding: 12px; display: flex; gap: 14px; align-items: center; }
.kcard.done { background: var(--skumaqua); }
.kcard.ledig { background: var(--lysrosa); display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; }
.kcard.ledig .btn { grid-column: 2; justify-self: start; }
#kidView h2 { margin-top: 6px; }
.kbilde { width: 84px; height: 84px; flex: none; display: grid; place-content: center; box-sizing: border-box; }
.kbilde img { display: block; width: 84px; height: 84px; }
.kbilde.tom { width: 76px; height: 76px; margin: 4px; border-radius: 16px; background: var(--kort); border: var(--strek); }
.kbilde.ferdig { border: 3px solid var(--skiltturkis); }
.kbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.kbody h3 { margin: 0; font-size: 18px; font-weight: 800; overflow-wrap: break-word; hyphens: auto; }
.kcard.done h3 { text-decoration: line-through; color: var(--krom); }
.kmeta { font-size: 14px; color: var(--krom); }
.kcard.done .kmeta { color: var(--blekk); font-weight: 800; }
.kcard.ledig .kmeta, .goal .field { color: var(--blekk); }
.task.done .tips summary, .task.done .del:not(.slett) { color: var(--blekk); }
.kbody .tips summary { font-size: 14px; font-weight: 800; }
.kcheck { width: 58px; height: 58px; margin: 2px; flex: none; box-sizing: border-box; border-radius: 50%; background: var(--kort); border: 7px solid var(--maskinmint); box-shadow: 0 0 0 2px var(--blekk); display: grid; place-content: center; color: var(--blekk); }
.kcheck[aria-pressed="true"] { background: var(--skapturkis); }
.neon { position: relative; overflow: hidden; background: var(--natt); border-radius: var(--radius-stor); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.neonring { position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--neon-rosa); box-shadow: 0 0 10px var(--neon-rosa), inset 0 0 10px var(--neon-rosa); }
.neontekst { position: relative; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.neonord { font-family: var(--font-neon); font-size: 46px; line-height: 1.1; color: var(--lysrosa); text-shadow: var(--glod-rosa); }
.neonunder { font-family: var(--font-overskrift); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--skumaqua); text-shadow: var(--glod-turkis); overflow-wrap: anywhere; }
.neonglitter { position: relative; flex: none; filter: drop-shadow(0 0 4px var(--neon-gul)) drop-shadow(0 0 10px var(--neon-gul)); }
.goal { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: var(--lysrosa); border: var(--strek); border-radius: var(--radius-kort); padding: 14px; }
.goal strong { flex-basis: 100%; }
.bunnmeny { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--kort); border-top: var(--strek); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bunnin { max-width: 800px; margin: 0 auto; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-block: 6px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.fane { background: none; border: 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; color: var(--krom); font-size: 12px; font-weight: 700; }
.fane img { display: block; width: 32px; height: 32px; }
.fane[aria-current] { color: var(--skiltturkis); font-weight: 800; }
.nyknapp { position: fixed; z-index: 16; right: max(20px, calc(50% - 360px), env(safe-area-inset-right, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  width: 56px; height: 56px; padding: 0; border: 0; border-radius: 50%; background: none; display: grid; place-content: center; }
.nyknapp img { display: block; width: 56px; height: 56px; }
.nyknapp:active { transform: translateY(2px); }
#adultView { padding-bottom: 176px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--blekk); color: var(--vegg); padding: 10px 16px; border-radius: 12px; max-width: calc(100% - 32px); z-index: 20; font-weight: 600; }
/* VaskMedMeg-planen */
.planboks { background: var(--kort); border: var(--strek); border-radius: var(--radius-stor); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.planboks.rosa { background: var(--lysrosa); }
.planboks h3 { margin: 0; font: 400 18px/1.2 var(--font-overskrift); letter-spacing: .02em; }
.planboks .ctl { grid-column: auto; }
.plankort { width: 100%; box-sizing: border-box; text-align: left; background: var(--kort); border: var(--strek); border-radius: var(--radius-stor); padding: 12px; display: flex; gap: 14px; align-items: center; min-height: 44px; }
.plankort:hover, .plankort.done { background: var(--skumaqua); }
.plankort img { width: 84px; height: 84px; flex: none; display: block; }

<script>
(function () {
  const $ = id => document.getElementById(id);
  const DAYS = ['man', 'tir', 'ons', 'tor', 'fre', 'lør', 'søn'];
  const DAYS_LONG = ['mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag', 'søndag'];
  const MONTHS = ['januar', 'februar', 'mars', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'desember'];
  const STAR = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" style="fill:var(--glitter);stroke:var(--blekk)" stroke-width="2.5" stroke-linejoin="round"/></svg>';
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const parse = s => { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); };
  const wd = d => (d.getDay() + 6) % 7 + 1; // 1 = mandag … 7 = søndag
  const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (wd(x) - 1)); return x; };
  function weekNo(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
  }

  /* Test: legg ?dato=ÅÅÅÅ-MM-DD på adressen for å late som det er en annen dag. */
  const FALSK_DATO = ((typeof location !== 'undefined' && location.search || '').match(/[?&]dato=(\d{4}-\d\d-\d\d)/) || [])[1];
  const naa = () => FALSK_DATO ? parse(FALSK_DATO) : new Date();
  const today = naa();
  const state = { members: [], tasks: [], done: {}, sel: iso(today), weekStart: monday(today), filter: 'all', childOnly: false, ready: false, confirmDel: null, editTips: null, openTips: new Set(), cmpPeriod: 'week' };
  let store, confirmTimer;
  /* Skjermene. «ny» er skjemaet bak plussknappen, «sjekklister» og «rom» hører til vaskeplanen. */
  const FANER = ['idag', 'uka', 'ny', 'familien', 'sjekklister', 'rom'], UTEN_NY = ['ny', 'sjekklister', 'rom'];
  const CHECK = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const PEOPLE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5.5"/></svg>';
  state.view = null; state.lastDone = null; state.editGoal = null; state.claims = {}; state.showAllBig = false;
  try { state.view = localStorage.getItem('husorden-view') || null; } catch (e) {}
  function setView(id) {
    state.view = id || null;
    try { localStorage.setItem('husorden-view', id || ''); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }
  const stars = t => Math.max(1, Math.round((Number(t.minutes) || 0) / 5));
  const starWord = n => n + (n === 1 ? ' stjerne' : ' stjerner');

  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const k in props || {}) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k in e) e[k] = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c);
    return e;
  }
  const star = () => h('span', { class: 'ico', innerHTML: STAR });
  const glitterIkon = px => h('span', { class: 'ico', innerHTML: GLITTER.replace('width="20" height="20"', 'width="' + px + '" height="' + px + '"') });
  const GLITTER = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.9 7.2 16.8 11.1 24 12C16.8 12.9 12.9 16.8 12 24C11.1 16.8 7.2 12.9 0 12C7.2 11.1 11.1 7.2 12 0Z" style="fill:var(--glitter);stroke:var(--blekk)" stroke-width="1"/></svg>';

  /* Skiltet (docs/design.md §3). Returnerer inline SVG som tekst; all innsatt tekst blir escaped.
     Bruk: el.innerHTML = skilt({ tekst: 'HUSORDEN', undertekst: '— VASK • RYDD • GLITRE —', bredde: 210 }) */
  function skilt({ tekst, undertekst, pil = true, bredde }) {
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const navn = String(tekst || '').toUpperCase(), under = String(undertekst || '').toUpperCase();
    const n = Math.max(1, Array.from(navn).length);
    const str = n > 9 ? Math.round(200 * 9 / n) : 200, lengde = Math.round(Math.min(760, n * str * 0.47));
    const ramme = '110,175 915,105 895,585 150,600';
    const lag = (farge, w) => '<polygon points="' + ramme + '" style="fill:var(' + farge + ');stroke:var(' + farge + ')" stroke-width="' + w + '" stroke-linejoin="round"/>';
    const firtakk = 'M12 0C12.9 7.2 16.8 11.1 24 12C16.8 12.9 12.9 16.8 12 24C11.1 16.8 7.2 12.9 0 12C7.2 11.1 11.1 7.2 12 0Z';
    const glitter = [[820, 150, 1.9], [880, 170, 1.1], [120, 440, 1.3], [160, 545, 1], [850, 520, 1.5]]
      .map(g => '<path transform="translate(' + g[0] + ' ' + g[1] + ') scale(' + g[2] + ')" d="' + firtakk + '" style="fill:var(--kort)"/>').join('');
    const felles = 'text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="' + str + '" textLength="' + lengde + '" lengthAdjust="spacingAndGlyphs"';
    let bokstaver = '';
    for (let i = 9; i >= 1; i--) {
      bokstaver += '<text x="' + (512 + i * 1.1).toFixed(1) + '" y="' + (372 + i * 1.2).toFixed(1) + '" ' + felles + ' style="fill:var(--skiltskygge)' +
        (i === 9 ? ';stroke:var(--blekk)" stroke-width="8" stroke-linejoin="round"' : '"') + '>' + esc(navn) + '</text>';
    }
    bokstaver += '<text x="512" y="372" ' + felles + ' style="fill:var(--skiltmint);stroke:var(--blekk)" stroke-width="7" stroke-linejoin="round" paint-order="stroke">' + esc(navn) + '</text>';
    const underLengde = Array.from(under).length > 26 ? ' textLength="700" lengthAdjust="spacingAndGlyphs"' : '';
    const underlinje = under ? '<text x="512" y="510" text-anchor="middle" font-family="\'Bebas Neue\', Impact, sans-serif" font-size="80" letter-spacing="4"' + underLengde + ' style="fill:var(--blekk)">' + esc(under) + '</text>' : '';
    const kant = farge => 'style="fill:var(' + farge + ');stroke:var(--blekk)" stroke-width="7" stroke-linejoin="round"';
    const stjerner =
      '<polygon points="137.9,93.3 160.6,126.2 200.2,121.0 176.0,152.7 193.1,188.8 155.4,175.5 126.4,203.0 127.4,163.1 92.3,143.9 130.6,132.5" ' + kant('--maskinmint') + '/>' +
      '<polygon points="263.1,59.6 268.6,96.4 303.9,108.2 270.6,124.9 270.2,162.1 244.1,135.6 208.6,146.7 225.8,113.7 204.2,83.4 240.9,89.5" ' + kant('--handklerosa') + '/>';
    const pilform = 'M262 598 L792 612 L784 576 L902 652 L776 728 L782 690 L256 680 L292 640 Z';
    let pilen = '';
    if (pil) {
      pilen = '<path transform="translate(10 12)" d="' + pilform + '" ' + kant('--blekk') + '/><path d="' + pilform + '" ' + kant('--maskinmint') + '/>';
      for (let i = 0; i < 11; i++) pilen += '<circle cx="' + (300 + i * 44) + '" cy="' + (639 + i * 0.27).toFixed(1) + '" r="' + (i % 2 ? 5 : 7) + '" style="fill:var(--kort)"/>';
    }
    const merke = esc(navn + (under ? ' – ' + under : ''));
    const maal = bredde ? ' width="' + Number(bredde) + '" height="' + Math.round(Number(bredde) * 760 / 1040) + '"' : '';
    return '<svg viewBox="0 0 1040 760"' + maal + ' role="img" aria-label="' + merke + '" xmlns="http://www.w3.org/2000/svg" style="display:block;max-width:100%;height:auto">' +
      lag('--blekk', 88) + lag('--maskinmint', 78) + lag('--kort', 30) + lag('--handklerosa', 20) +
      glitter + bokstaver + underlinje + stjerner + pilen + '</svg>';
  }


  /* ---------- lagring ---------- */
  function apply(col, map) {
    if (col === 'sjekk') { state.sjekk = {}; for (const k in map) state.sjekk[k] = Object.assign({}, map[k]); }
    else if (col === 'planvalg') state.valg = map.valg ? Object.assign({}, map.valg) : null;
    else if (col === 'done') { state.done = {}; state.claims = {}; for (const k in map) { state.done[k] = Object.assign({}, (map[k] || {}).ids); state.claims[k] = Object.assign({}, (map[k] || {}).claims); } }
    else state[col] = Object.entries(map).map(([id, b]) => Object.assign({}, b, { id })).sort((a, b) => (a.created || 0) - (b.created || 0));
  }
  function makeLocal() {
    const KEY = 'husorden-v1';
    let data = { members: {}, tasks: {}, done: {}, sjekk: {}, planvalg: {} };
    try { const r = localStorage.getItem(KEY); if (r) data = Object.assign(data, JSON.parse(r)); } catch (e) {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
    const push = () => { ['members', 'tasks', 'done', 'sjekk', 'planvalg'].forEach(c => apply(c, data[c])); render(); };
    return {
      newId: () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36),
      set(col, id, body) { data[col][id] = body; save(); push(); return Promise.resolve(); },
      del(col, id) { delete data[col][id]; save(); push(); return Promise.resolve(); },
      start() { state.ready = true; state.planKlar = true; note('Denne visningen lagrer bare i denne nettleseren. Logg inn for å dele listen med familien.'); push(); }
    };
  }
  function makeDb(db) {
    const chain = {};
    const run = (path, fn) => (chain[path] = (chain[path] || Promise.resolve()).catch(() => {}).then(fn));
    return {
      newId: () => db.collection('tasks').doc().id,
      set: (col, id, body) => run(col + '/' + id, () => db.collection(col).doc(id).set(body)),
      del: (col, id) => run(col + '/' + id, () => db.collection(col).doc(id).delete()),
      start() {
        const seen = {};
        const timer = setTimeout(() => { if (!state.ready) note('Får ikke kontakt med lagringen ennå. Prøver videre …'); }, 10000);
        ['members', 'tasks', 'done'].forEach(col => db.collection(col).onSnapshot(snap => {
          const map = {}; snap.docs.forEach(d => { map[d.id] = d.data(); });
          apply(col, map); seen[col] = true;
          if (seen.members && seen.tasks && seen.done && !state.ready) { clearTimeout(timer); state.ready = true; note(''); }
          render();
        }, () => { clearTimeout(timer); state.ready = true; note('Lagringen er ikke tilgjengelig akkurat nå. Endringer blir ikke lagret.'); render(); }));
        /* Vaskeplanen har egne samlinger. Resten av appen venter ikke på dem. */
        ['sjekk', 'planvalg'].forEach(col => db.collection(col).onSnapshot(snap => {
          const map = {}; snap.docs.forEach(d => { map[d.id] = d.data(); });
          apply(col, map); seen[col] = true;
          if (seen.sjekk && seen.planvalg) state.planKlar = true;
          render();
        }, () => { note('Vaskeplanen kan ikke lagres akkurat nå.'); }));
      }
    };
  }
  function write(p) {
    p.catch(e => toast(e && e.code === 'invalid_argument' ? 'Du har bare lesetilgang til denne siden.' : e && e.code === 'quota_exceeded' ? 'Lageret er fullt. Slett noen oppgaver først.' : 'Kunne ikke lagre. Prøv igjen.'));
  }
  function saveTask(t, patch) { const body = Object.assign({}, t, patch); delete body.id; write(store.set('tasks', t.id, body)); }

  /* ---------- logikk ---------- */
  /* Planuke 1–4: fast rotasjon regnet fra mandag 1. januar 2024. */
  const EPOCH = new Date(2024, 0, 1);
  const planWeek = d => (((Math.floor(Math.round((monday(d) - EPOCH) / 864e5) / 7) % 4) + 4) % 4) + 1;
  /* Hvem som har oppgaven en gitt dag: dagens valg går foran fast ansvarlig. */
  function eff(t, day) {
    const c = (state.claims[day] || {})[t.id];
    if (c === '-') return null;
    if (c && member(c)) return c;
    return member(t.assignee) ? t.assignee : null;
  }
  function lastDone(t, day) { let best = null; for (const k in state.done) if (k < day && state.done[k][t.id] && (!best || k > best)) best = k; return best; }
  function isDue(t, day) { const last = lastDone(t, day); return !last || Math.round((parse(day) - parse(last)) / 864e5) >= (Number(t.every) || 8) * 7; }
  function appliesOn(t, dateStr) {
    if (t.kind === 'stor') { const c = (state.claims[dateStr] || {})[t.id]; return !!(state.done[dateStr] || {})[t.id] || !!(c && c !== '-' && member(c)); }
    if (t.date) return t.date === dateStr;
    const d = parse(dateStr);
    if (Array.isArray(t.rot) && t.rot.length && !t.rot.includes(planWeek(d))) return false;
    if (Array.isArray(t.days) && t.days.length) return t.days.includes(wd(d));
    return true;
  }

  const startsvaner = () => UKEPLAN.startsvaner.map((navn, i) => ({ i, navn, task: state.tasks.find(t => t.kind === 'vane' && SVANE_TREFF[i] && SVANE_TREFF[i].test(t.title)) || null }));

  /* Faste rutiner (dusjglass, seng og hverdagsflasken) blir vanlige oppgaver med id «rutine-<id>». */
  const rutineFinnes = r => state.tasks.some(t => t.id === 'rutine-' + r.id);
  function lagRutiner(ids) {
    const reOpp = state.tasks.find(t => /^re opp seng/i.test(t.title)), naatid = Date.now(), utsatt = Object.assign({}, valg().utsatt);
    let uker = 0;
    RUTINER.forEach((r, i) => {
      if (!ids.has(r.id) || rutineFinnes(r)) return;
      const hver = { 'hver 6. uke': 6, kvartalsvis: 13, 'halvårlig': 26 }[r.intervall] || null;
      const romId = r.id.startsWith('dusj') ? 'baderom' : 'soverom';
      /* De sjeldne rutinene spres utover, så ikke alle dukker opp samtidig: første om to uker, neste om fire, osv. */
      if (hver) { uker += 2; const d = naa(); d.setDate(d.getDate() + uker * 7); utsatt['rutine-' + r.id] = iso(monday(d)); }

        date: null, child: !!r.barn, assignee: null, tips: r.tips || '', ikon: r.ikon || null, every: hver,

    });

  /* Ett lite steg: etter en uke foreslås neste rom som verken er slått på eller valgt bort. */
  function nesteRom() {
    const v = valg();

        })),

      : (state.filter === 'all' && !state.childOnly ? svaneRad(s, day) : null)).filter(Boolean);

  /* Barnevisningen: punkter barnet har tatt (eller gjort i dag), og ledige punkter fra dagens plan. */
  function kidPunkter(kid, day) {
    const egne = [], ledige = [];
    ROM.forEach(r => { const dok = sjekkDok(r.id, day); r.seksjoner.forEach(s => s.punkter.forEach(p => {
      const e = dok[p.id]; if (e && e.av === kid.id && (e.status === 'tatt' || e.dato === day)) egne.push({ r, p, e });
    })); });
    dagensRom(day).forEach(r => { const dok = sjekkDok(r.id, day); dagensPunkter(r, day).forEach(p => { if (!dok[p.id]) ledige.push({ r, p }); }); });
    return { egne, ledige: ledige.slice(0, 4) };
  }
  function kidPunktKort(x, day, kid) {
    const done = ferdig(x.e), pid = x.r.id + '-' + x.p.id, tittel = x.r.navn + ': ' + x.p.tittel;
    return h('article', { class: 'kcard' + (done ? ' done' : '') },
      bilde({ ikon: x.r.ikon }, done),
      h('div', { class: 'kbody' },
        h('h3', { text: tittel }),
        h('p', { class: 'kmeta', text: done ? (x.e.status === 'fint' ? 'Ser fint ut' : 'Vasket') + ' · +' + starWord(1) : starWord(1) }),
        !done && x.p.husk && x.p.husk.length <= 100 && h('p', { class: 'kmeta', text: 'Husk: ' + x.p.husk }),
        !done && h('div', { class: 'ctl' },
          h('button', { type: 'button', id: 'kpf-' + pid, class: 'btn liten', onclick: () => { state.lastDone = null; settPunkt(x.r, x.p, day, { status: 'fint', av: kid.id, dato: day }); } }, 'Ser fint ut'),
          h('button', { type: 'button', id: 'kpr-' + pid, class: 'del', onclick: () => settPunkt(x.r, x.p, day, null) }, 'Legg tilbake'))),
      h('button', { type: 'button', id: 'kpd-' + pid, class: 'kcheck', 'aria-pressed': String(done), 'aria-label': (done ? 'Angre: ' : 'Vasket: ') + tittel,
        onclick: () => { state.lastDone = null; settPunkt(x.r, x.p, day, done ? { status: 'tatt', av: kid.id, dato: day } : { status: 'vasket', av: kid.id, dato: day }); } }, done && h('span', { class: 'ico', innerHTML: CHECK })));
  }
  function kidLedigPunkt(x, day, kid) {
    const tittel = x.r.navn + ': ' + x.p.tittel;
    return h('article', { class: 'kcard ledig' },
      bilde({ ikon: x.r.ikon }, false),
      h('div', { class: 'kbody' }, h('h3', { text: tittel }), h('p', { class: 'kmeta', text: starWord(1) })),
      h('button', { type: 'button', id: 'kpt-' + x.r.id + '-' + x.p.id, class: 'btn primary', 'aria-label': 'Ta den: ' + tittel, onclick: () => settPunkt(x.r, x.p, day, { status: 'tatt', av: kid.id, dato: day }) }, 'Ta den'));
  }

  function render() {
    const a = document.activeElement, fid = a && a.id && !a.closest('form') ? a.id : null;
    const vm = member(state.view), kid = vm && vm.child ? vm : null;
    $('adultView').hidden = !!kid; $('adultTop').hidden = !!kid; $('bunnmeny').hidden = !!kid; $('nyKnapp').hidden = !!kid || UTEN_NY.includes(state.tab); $('topChecker').hidden = !!kid; $('kidView').hidden = !kid;
    if (kid) renderKid(kid); else $('kidView').replaceChildren();
    renderKidLinks(); renderGoal();
    renderWeek(); renderFilters(); renderDay(); renderCompare(); renderMembers();
    renderUkaPlan(); renderSjekklister(); renderRom(); renderPlanInnst();
    if (fid && $(fid) && document.activeElement !== $(fid)) $(fid).focus();
  }

  /* ---------- skjema og navigasjon ---------- */
  DAYS_LONG.forEach((name, i) => $('f-days').append(h('label', { class: 'check' }, h('input', { type: 'checkbox', class: 'cb', id: 'f-d' + (i + 1), value: String(i + 1) }), name)));
  Object.keys(BILDER).forEach(navn => $('f-ikon').append(h('option', { value: navn, text: BILDER[navn] })));
  $('f-repeat').addEventListener('change', e => { $('f-days').hidden = e.target.value !== 'days'; });
  $('f-kind').addEventListener('change', e => {
    const big = e.target.value === 'stor';
    $('f-every-wrap').hidden = !big; $('f-repeat-wrap').hidden = big; $('f-rot-wrap').hidden = big;
    $('f-days').hidden = big || $('f-repeat').value !== 'days';
    if (e.target.value === 'vane' && $('f-repeat').value === 'once') { $('f-repeat').value = 'daily'; }
  });

  $('taskForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('f-title').value.trim(); if (!title) return;
    const big = $('f-kind').value === 'stor', rep = big ? 'daily' : $('f-repeat').value;
    let days = [];
    if (rep === 'days') {
      days = [1, 2, 3, 4, 5, 6, 7].filter(n => $('f-d' + n).checked);
      if (!days.length) { toast('Velg minst én ukedag.'); return; }
    }
    write(store.set('tasks', store.newId(), {
      title, minutes: Math.max(0, Math.round(Number($('f-min').value) || 0)), kind: $('f-kind').value,
      days, date: rep === 'once' ? state.sel : null, child: $('f-child').checked, assignee: big ? null : ($('f-who').value || null), tips: $('f-tips').value.trim(), created: Date.now(),
      ikon: $('f-ikon').value || null,
      rot: big ? [] : $('f-rot').value.split('').map(Number), every: big ? Math.min(52, Math.max(1, Math.round(Number($('f-every').value) || 8))) : null, order: Date.now()
    }));
    $('f-tips').value = ''; $('f-title').value = ''; $('f-title').focus();
    toast('Oppgaven er lagt til.');
  });

  $('memberForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('m-name').value.trim(); if (!name) return;
    write(store.set('members', store.newId(), { name, child: $('m-child').checked, created: Date.now() }));
    $('m-name').value = ''; $('m-child').checked = false; $('m-name').focus();
  });

  function shiftWeek(n) {
    const sel = parse(state.sel); sel.setDate(sel.getDate() + 7 * n);
    state.sel = iso(sel); state.weekStart = monday(sel); render();
  }
  $('prevWeek').addEventListener('click', () => shiftWeek(-1));
  $('nextWeek').addEventListener('click', () => shiftWeek(1));
  /* Faner: hver fane er en egen skjerm. «ny» er skjemaet bak plussknappen. */
  function visFane(valgt) {
    state.tab = FANER.includes(valgt) ? valgt : 'idag';
    if (state.tab === 'rom' && !state.rom) state.tab = 'sjekklister';
    /* Sjekklistene hører til «Uka». Et rom hører til der det ble åpnet fra. */
    const merket = state.tab === 'sjekklister' ? 'uka' : state.tab === 'rom' ? (state.rom.modus === 'idag' ? 'idag' : 'uka') : state.tab;
    FANER.forEach(k => { $('sek-' + k).hidden = k !== state.tab; });
    ['idag', 'uka', 'familien'].forEach(k => {
      const aktiv = k === merket;
      if (aktiv) $('fane-' + k).setAttribute('aria-current', 'true'); else $('fane-' + k).removeAttribute('aria-current');
      $('ikon-' + k).src = 'assets/nav/' + k + (aktiv ? '-aktiv' : '') + '.png';
    });
    const utenUke = state.tab !== 'idag' && state.tab !== 'uka';
    $('weekLabel').hidden = utenUke;
    $('ukeknapper').hidden = utenUke;
    $('nyKnapp').hidden = UTEN_NY.includes(state.tab) || $('adultView').hidden;
  }
  function gaaTil(fane) {
    visFane(fane);
    try { if (location.hash !== '#' + state.tab) location.hash = state.tab; } catch (e) {}
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== state.tab) visFane(h); });
  $('fane-idag').addEventListener('click', () => {
    const t = naa(); state.sel = iso(t); state.weekStart = monday(t); render();
    gaaTil('idag');
  });
  $('fane-uka').addEventListener('click', () => gaaTil('uka'));
  $('fane-familien').addEventListener('click', () => gaaTil('familien'));
  $('nyKnapp').addEventListener('click', () => { gaaTil('ny'); $('f-title').focus({ preventScroll: true }); });

  /* ---------- start ---------- */
  $('logo').innerHTML = skilt({ tekst: 'HUSORDEN', undertekst: '— VASK • RYDD • GLITRE —', bredde: 210 });
  ['idag', 'uka', 'familien', 'barn'].forEach(k => { new Image().src = 'assets/nav/' + k + '.png'; new Image().src = 'assets/nav/' + k + '-aktiv.png'; });
  document.documentElement.lang = 'nb';
  state.tab = 'idag';
  visFane((location.hash || '#idag').slice(1));
  store = { newId: () => '', set: () => Promise.reject({}), del: () => Promise.reject({}) };
  render();
  (window.claude && window.claude.use ? window.claude.use('db').catch(() => null) : Promise.resolve(null)).then(db => {
    store = db ? makeDb(db) : makeLocal();
    store.start();
  });
})();
</script>
