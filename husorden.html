<title>Husorden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Righteous&family=Figtree:wght@400;500;600;700;800&family=Neonderthaw&display=swap">
<style>
/* Oppsett: én kolonne, maks 760 px. Sjakkbånd øverst, ukestripe, dagskort og lister, så sammenligning, ny oppgave og familien.
   Utseende: vaskerom-retningen, se docs/design.md. Variablene under er kopiert fra design/tokens.css. */
:root {
  /* Grunnfarger */
  --vegg: #FBF7F0;          /* bakgrunn i hele appen */
  --kort: #FFFFFF;          /* kort og lister */
  --blekk: #1A2227;         /* tekst, konturer, sjakkruter, harde skygger */
  --krom: #5E6A72;          /* dempet tekst (5,2:1 på --vegg) */

  /* Turkis */
  --skapturkis: #1FC1B8;    /* hovedfarge: primærknapper, valgt dag, avkrysset. Tekst på den: --blekk */
  --skiltturkis: #0B7A74;   /* skiltkant, lenker, seksjonstitler, piler (4,9:1 på --vegg) */

  /* Mint og aqua */
  --maskinmint: #8EE3C8;    /* ring på avkrysning, skiltramme, fremdrift */
  --skumaqua: #D2F4EE;      /* ferdige oppgaver, myke flater */
  --skiltmint: #B8F0DD;     /* fyll i skiltbokstaver */

  /* Rosa */
  --handklerosa: #F7A1B5;   /* skiltflate, barn, feiring. Tekst på den: --blekk */
  --lysrosa: #FFD9E1;       /* myke flater, barnechips */
  --skiltskygge: #E58A9B;   /* 3D-skygge i skiltbokstaver */

  /* Glitter og varsel */
  --glitter: #FFE45C;       /* stjerner, belønning */
  --kirsebaer: #B4233F;     /* slett / feil – i små doser */

  /* Neon – KUN på --natt, KUN til feiring */
  --natt: #141A22;
  --neon-rosa: #FF4FA3;
  --neon-turkis: #2FF3E0;
  --neon-gul: #FFE45C;

  /* Typografi */
  --font-skilt: "Anton", Impact, sans-serif;           /* logo/skilt-navn */
  --font-skilt-under: "Bebas Neue", Impact, sans-serif; /* skiltets undertekst, illustrasjonsnavn */
  --font-overskrift: "Righteous", system-ui, sans-serif; /* overskrifter, tall, seksjonstitler */
  --font-tekst: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; /* all brødtekst og UI */
  --font-neon: "Neonderthaw", cursive;                  /* bare neon-feiring */

  /* Form */
  --strek: 2px solid var(--blekk);
  --radius-kort: 22px;
  --radius-stor: 24px;
  --radius-pille: 999px;
  --skygge-knapp: 0 5px 0 var(--skiltturkis);    /* primærknapp */
  --skygge-knapp-sek: 0 5px 0 var(--maskinmint); /* sekundærknapp */
  --skygge-valgt: 0 4px 0 var(--skiltturkis);    /* valgt dag */

  /* Mønstre */
  --tapet: radial-gradient(var(--handklerosa) 1.3px, transparent 1.5px) 0 0 / 28px 28px,
           radial-gradient(var(--maskinmint) 1.3px, transparent 1.5px) 14px 14px / 28px 28px,
           var(--vegg);
  --sjakk: repeating-conic-gradient(var(--blekk) 0 25%, #FFFFFF 0 50%) 0 0 / 16px 16px;

  /* Neon-glød */
  --glod-rosa: 0 0 3px var(--neon-rosa), 0 0 10px var(--neon-rosa), 0 0 22px var(--neon-rosa);
  --glod-turkis: 0 0 3px var(--neon-turkis), 0 0 10px var(--neon-turkis);

  color-scheme: light; /* mørk modus designes senere */
}
body { background: var(--vegg); color: var(--blekk); font: 400 16px/1.45 var(--font-tekst); }
.checker { height: 16px; background: var(--sjakk); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-skilt); font-weight: 400; font-size: 2.25rem; line-height: 1.1; text-transform: uppercase; letter-spacing: .02em; display: flex; align-items: flex-start; gap: 6px; }
h2 { font-family: var(--font-overskrift); font-weight: 400; font-size: 1.4rem; line-height: 1.2; }
p { margin: 0; }
.muted { color: var(--krom); }
.small { font-size: .85rem; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--skiltturkis); outline-offset: 2px; }
.ico { display: inline-flex; flex: none; }
.ico svg { display: block; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.nav { display: flex; gap: 6px; }
.btn { background: var(--kort); border: var(--strek); border-radius: 12px; padding: 8px 14px; min-height: 44px; min-width: 44px; font-weight: 600; display: inline-grid; place-content: center; }
.btn:hover { background: var(--skumaqua); }
.btn.primary { background: var(--skapturkis); color: var(--blekk); box-shadow: 3px 3px 0 var(--blekk); font-weight: 700; }
.btn.primary:hover { background: var(--skapturkis); }
.btn.primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--blekk); }

.note { background: var(--lysrosa); border: var(--strek); border-radius: 12px; padding: 10px 12px; font-size: .9rem; }

.week { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.daybtn { width: 100%; background: var(--kort); border: var(--strek); border-radius: 12px; padding: 6px 0;
  display: flex; flex-direction: column; align-items: center; gap: 1px; font-variant-numeric: tabular-nums; }
.daybtn .abbr { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--krom); }
.daybtn .num { font-family: var(--font-overskrift); font-size: 1.2rem; font-weight: 400; line-height: 1.1; }
.daybtn .cnt { font-size: .7rem; color: var(--krom); }
.daybtn.today { background: var(--handklerosa); }
.daybtn.today .abbr, .daybtn.today .cnt { color: var(--blekk); }
.daybtn[aria-pressed="true"] { background: var(--skapturkis); color: var(--blekk); box-shadow: 3px 3px 0 var(--blekk); }
.daybtn[aria-pressed="true"] .abbr, .daybtn[aria-pressed="true"] .cnt { color: var(--blekk); }

.card { background: var(--kort); border: var(--strek); border-radius: var(--radius-stor); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h2::first-letter { text-transform: uppercase; }
.bar { height: 16px; border: var(--strek); border-radius: var(--radius-pille); background: var(--vegg); overflow: hidden; display: flex; }
.bar > span { background: var(--skapturkis); border-right: var(--strek); transition: width .25s; }
.bar > span[data-zero] { border-right: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--kort); border: var(--strek); border-radius: var(--radius-pille); padding: 6px 14px; min-height: 40px; font-size: .9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--blekk); color: var(--vegg); }
.chip.kid[aria-pressed="true"] { background: var(--handklerosa); color: var(--blekk); box-shadow: 3px 3px 0 var(--blekk); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--kort); border: 1.5px solid var(--blekk); flex: none; }
.chip[aria-pressed="true"] .dot { border-color: var(--vegg); }

.day { display: flex; flex-direction: column; gap: 16px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group h3 { margin: 0; font: 700 .75rem var(--font-tekst); text-transform: uppercase; letter-spacing: .1em; color: var(--krom); }
.tasks { list-style: none; margin: 0; padding: 0; background: var(--kort); border: var(--strek); border-radius: var(--radius-kort); overflow: hidden; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 12px 14px; }
.task + .task { border-top: var(--strek); }
.task.done { background: var(--skumaqua); }
.cb { appearance: none; -webkit-appearance: none; width: 28px; height: 28px; margin: 0; border: var(--strek); border-radius: 8px; background: var(--kort); display: grid; place-content: center; cursor: pointer; flex: none; grid-row: 1 / span 2; align-self: start; }
.cb:checked { background: var(--skapturkis); }
.cb:checked::after { content: ""; width: 12px; height: 6px; border-left: 3px solid var(--blekk); border-bottom: 3px solid var(--blekk); transform: translateY(-2px) rotate(-45deg); }
.task .title { font-weight: 600; overflow-wrap: anywhere; cursor: pointer; }
.task .meta { grid-column: 2; font-size: .85rem; color: var(--krom); font-variant-numeric: tabular-nums; }
.task.done .title { text-decoration: line-through; color: var(--krom); }
.ctl { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { border: 2px dashed var(--krom); background: transparent; color: var(--krom); border-radius: var(--radius-pille); padding: 2px 10px; font-size: .8rem; font-weight: 600; min-height: 32px; display: inline-flex; align-items: center; gap: 4px; }
.tag[aria-pressed="true"] { background: var(--handklerosa); color: var(--blekk); border: var(--strek); font-weight: 700; }
.who { background: var(--kort); border: var(--strek); border-radius: var(--radius-pille); padding: 2px 10px; min-height: 32px; font-size: .8rem; font-weight: 700; max-width: 100%; }
.who.adult { background: var(--kort); }
.who.kid { background: var(--handklerosa); }
.del { background: transparent; border: 0; color: var(--krom); font-size: .85rem; font-weight: 600; padding: 4px 8px; min-height: 32px; border-radius: 8px; text-decoration: underline; }
.del:hover, .del.sure { color: var(--kirsebaer); }
.del.sure { font-weight: 700; outline: 2px solid var(--kirsebaer); text-decoration: none; }
.tips { grid-column: 2; font-size: .9rem; min-width: 0; }
.tips summary { cursor: pointer; color: var(--skiltturkis); font-weight: 700; padding: 4px 0; width: fit-content; }
.tips ol { margin: 6px 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; max-width: 60ch; }
.tips p { margin: 6px 0; }
.tips .ctl { margin-top: 8px; }
textarea { background: var(--kort); border: var(--strek); border-radius: 12px; padding: 8px 10px; width: 100%; box-sizing: border-box; resize: vertical; }
.empty { color: var(--krom); padding: 16px; background: var(--kort); border: 2px dashed var(--blekk); border-radius: var(--radius-kort); }

.panel { display: flex; flex-direction: column; gap: 12px; border-top: var(--strek); padding-top: 20px; }
.cmp { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.cmp li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.cmp .name { font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.cmp .val { font-size: .85rem; color: var(--krom); font-variant-numeric: tabular-nums; text-align: right; }
.cmp .bar { grid-column: 1 / -1; height: 20px; }
.cmp .bar > span.adult { background: var(--kort); }
.cmp .bar > span.kid { background: var(--handklerosa); }
.cmp .bar > span.nobody { background: var(--skumaqua); }
.lead { font-family: var(--font-overskrift); font-weight: 400; font-size: 1.1rem; }

form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: .85rem; font-weight: 600; color: var(--krom); }
.field.grow { flex: 1 1 220px; }
.field.full { flex-basis: 100%; }
.field input[type="text"], .field input[type="number"], .field select { background: var(--kort); color: var(--blekk); border: var(--strek); border-radius: 12px; padding: 8px 10px; min-height: 44px; font-size: 1rem; font-weight: 400; width: 100%; box-sizing: border-box; }
.field textarea { color: var(--blekk); font-size: 1rem; font-weight: 400; }
.field.num { width: 90px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--blekk); font-size: .95rem; font-weight: 500; }
.check .cb { width: 24px; height: 24px; grid-row: auto; align-self: center; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; flex-basis: 100%; }
legend { font-size: .85rem; font-weight: 600; color: var(--krom); padding: 0; margin-bottom: 4px; }
.people { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.person { display: flex; align-items: center; gap: 8px; background: var(--kort); border: var(--strek); border-radius: var(--radius-pille); padding: 2px 6px 2px 14px; font-weight: 700; }
.person.kid { background: var(--handklerosa); }
.person .role { font-size: .8rem; font-weight: 600; }
.person .del { color: var(--blekk); }

.sel { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--krom); max-width: 100%; }
.who.free { border-style: dashed; background: var(--handklerosa); }
.free { font-weight: 700; background: var(--handklerosa); border: var(--strek); border-radius: 10px; padding: 4px 10px; width: fit-content; font-size: .9rem; }
.del:disabled { opacity: .35; cursor: default; }
.kidlabel { align-self: center; font-size: .85rem; font-weight: 700; color: var(--krom); }
.chip.go { background: var(--handklerosa); }
.kidhead { background: var(--handklerosa); }
.kidin { max-width: 760px; margin: 0 auto; padding-block: 24px 20px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.kidtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.kidhead h1 { font-size: 2.5rem; overflow-wrap: anywhere; min-width: 0; }
.kidsub { font-weight: 600; }
.round { width: 48px; height: 48px; border-radius: 50%; background: var(--kort); border: var(--strek); display: grid; place-content: center; flex: none; }
.starcard { background: var(--kort); border: var(--strek); border-radius: var(--radius-kort); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 3px 3px 0 var(--blekk); }
.starrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
.starnum { font-family: var(--font-overskrift); font-weight: 400; font-size: 1.25rem; display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.kcards { display: flex; flex-direction: column; gap: 22px; }
.kcard { position: relative; background: var(--kort); border: var(--strek); border-radius: var(--radius-stor); padding: 14px; display: flex; gap: 14px; align-items: center; box-shadow: 4px 4px 0 var(--blekk); }
.kcard.done { background: var(--skumaqua); box-shadow: none; }
.kbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.kbody h3 { margin: 0; font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; }
.kcard.done h3 { text-decoration: line-through; color: var(--krom); }
.kmeta { font-size: .9rem; color: var(--krom); }
.kcard.done .kmeta { color: var(--skiltturkis); font-weight: 700; }
.kcheck { width: 60px; height: 60px; flex: none; border-radius: 16px; background: var(--kort); border: var(--strek); display: grid; place-content: center; color: var(--blekk); }
.kcheck[aria-pressed="true"] { background: var(--skapturkis); }
.sticker { position: absolute; top: -18px; right: 64px; background: var(--kort); border: var(--strek); border-radius: 10px; padding: 4px 14px; font-family: var(--font-skilt); font-size: 1.1rem; box-shadow: 3px 3px 0 var(--blekk); transform: rotate(-4deg); }
.goal { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: var(--kort); border: var(--strek); border-radius: var(--radius-kort); padding: 12px; }
.goal strong { flex-basis: 100%; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--blekk); color: var(--vegg); padding: 10px 16px; border-radius: 12px; max-width: calc(100% - 32px); z-index: 20; font-weight: 600; }
@media (max-width: 420px) { h1 { font-size: 2rem; } .daybtn .num { font-size: 1.1rem; } }
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>

<div id="kidView" hidden></div>
<div class="checker" id="topChecker" aria-hidden="true"></div>
<div class="wrap" id="adultView">
  <header class="top">
    <div>
      <h1>Husorden <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.9 7.2 16.8 11.1 24 12C16.8 12.9 12.9 16.8 12 24C11.1 16.8 7.2 12.9 0 12C7.2 11.1 11.1 7.2 12 0Z" style="fill:var(--glitter);stroke:var(--blekk)" stroke-width="1"/></svg></h1>
      <p class="muted" id="weekLabel"></p>
    </div>
    <div class="nav">
      <button class="btn" id="prevWeek" type="button" aria-label="Forrige uke"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="btn" id="goToday" type="button">I dag</button>
      <button class="btn" id="nextWeek" type="button" aria-label="Neste uke"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </header>

  <p class="note" id="note" hidden></p>

  <div class="filters" id="kidLinks" hidden></div>

  <ol class="week" id="week" aria-label="Ukedager"></ol>

  <section class="day" aria-live="polite">
    <div class="card">
      <h2 id="dayTitle"></h2>
      <p class="muted" id="daySummary"></p>
      <p class="free" id="dayFree" hidden></p>
      <div class="bar" id="dayBar" role="img"><span></span></div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="day" id="lists"></div>
  </section>

  <section class="panel">
    <h2>Hvem gjør mest?</h2>
    <div class="filters" id="cmpPeriod"></div>
    <p class="lead" id="cmpLead"></p>
    <ul class="cmp" id="cmpList"></ul>
    <p class="muted small">Regnet fra avkryssede oppgaver og minuttene de er satt til. En oppgave teller for den som var tildelt da den ble krysset av.</p>
  </section>

  <section class="panel">
    <h2>Ny oppgave</h2>
    <form id="taskForm" autocomplete="off">
      <label class="field grow">Hva skal gjøres?
        <input type="text" id="f-title" maxlength="120" required placeholder="F.eks. tørke av kjøkkenbenken">
      </label>
      <label class="field num">Minutter
        <input type="number" id="f-min" min="0" max="600" step="5" value="10">
      </label>
      <label class="field">Type
        <select id="f-kind"><option value="vane">Daglig vane</option><option value="oppgave">Oppgave</option><option value="plan">Dagens halvtime</option><option value="stor">Større ryddeoppgave (innimellom)</option></select>
      </label>
      <label class="field num" id="f-every-wrap" hidden>Hver … uke
        <input type="number" id="f-every" min="1" max="52" value="8">
      </label>
      <label class="field" id="f-rot-wrap">Planuke
        <select id="f-rot"><option value="">Alle uker</option><option value="1">Planuke 1</option><option value="2">Planuke 2</option><option value="3">Planuke 3</option><option value="4">Planuke 4</option><option value="13">Planuke 1 og 3</option><option value="24">Planuke 2 og 4</option></select>
      </label>
      <label class="field" id="f-repeat-wrap">Når
        <select id="f-repeat">
          <option value="daily">Hver dag</option>
          <option value="days">Faste ukedager</option>
          <option value="once" id="f-once-opt">Bare valgt dag</option>
        </select>
      </label>
      <label class="field">Fast ansvarlig
        <select id="f-who"><option value="">Ingen (ledig)</option></select>
      </label>
      <fieldset id="f-days" hidden>
        <legend>Hvilke dager?</legend>
      </fieldset>
      <label class="field full">Tips til hvordan den gjøres (valgfritt, ett steg per linje)
        <textarea id="f-tips" rows="3" maxlength="2000"></textarea>
      </label>
      <label class="check"><input class="cb" type="checkbox" id="f-child"> Barneoppgave</label>
      <button class="btn primary" type="submit">Legg til oppgave</button>
    </form>
  </section>

  <section class="panel">
    <h2>Familien</h2>
    <ul class="people" id="members"></ul>
    <div class="goal" id="goalEdit" hidden></div>
    <form id="memberForm" autocomplete="off">
      <label class="field grow">Navn
        <input type="text" id="m-name" maxlength="40" required>
      </label>
      <label class="check"><input class="cb" type="checkbox" id="m-child"> Barn</label>
      <button class="btn primary" type="submit">Legg til person</button>
    </form>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const DAYS = ['man', 'tir', 'ons', 'tor', 'fre', 'lør', 'søn'];
  const DAYS_LONG = ['mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag', 'søndag'];

  const STAR = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" style="fill:var(--glitter);stroke:var(--blekk)" stroke-width="2.5" stroke-linejoin="round"/></svg>';

    rows.sort((a, b) => (a.nobody ? 1 : 0) - (b.nobody ? 1 : 0) || val(b) - val(a));
    const total = rows.reduce((s, r) => s + val(r), 0), max = Math.max(1, ...rows.map(val));
    const people = rows.filter(r => !r.nobody), top = people[0];
    const period = days === 7 ? 'denne uka' : 'de siste 4 ukene';
    $('cmpLead').textContent = !state.ready ? '' : !state.members.length ? 'Legg til familien først, så vises fordelingen her.'
      : !total ? 'Ingen oppgaver er krysset av ' + period + ' ennå.'
      : !top || !val(top) ? 'Oppgavene som er gjort ' + period + ', var ikke tildelt noen.'
      : people[1] && val(people[1]) === val(top) ? 'Det står likt i toppen ' + period + '.'
      : top.name + ' har gjort mest ' + period + '.';
    $('cmpList').replaceChildren(...(total ? rows.map(r => {
      const w = Math.round(100 * val(r) / max), share = Math.round(100 * val(r) / total);
      return h('li', null,
        h('span', { class: 'name' }, r.nobody ? null : r.child ? star() : h('span', { class: 'dot' }), h('span', { text: r.name })),
        h('span', { class: 'val', text: r.min + ' min · ' + r.n + (r.n === 1 ? ' oppgave' : ' oppgaver') + ' · ' + share + ' %' }),
        h('div', { class: 'bar', role: 'img', 'aria-label': r.name + ': ' + share + ' prosent' },
          h('span', Object.assign({ class: r.nobody ? 'nobody' : r.child ? 'kid' : 'adult', style: 'width:' + w + '%' }, w === 0 || w === 100 ? { 'data-zero': '' } : {}))));
    }) : []));
  }

  function renderMembers() {
    const sel = $('f-who'), cur = sel.value;
    sel.replaceChildren(h('option', { value: '', text: 'Ingen (ledig)' }), ...state.members.map(m => h('option', { value: m.id, text: m.name + (m.child ? ' (barn)' : '') })));
    sel.value = member(cur) ? cur : '';
    $('members').replaceChildren(...(state.members.length ? state.members.map(m => {
      const sure = state.confirmDel === 'm:' + m.id;
      return h('li', { class: 'person' + (m.child ? ' kid' : '') },
        m.child && star(), h('span', { text: m.name }), h('span', { class: 'role', text: m.child ? 'barn' : 'voksen' }),
        m.child && h('button', { type: 'button', id: 'mgoal-' + m.id, class: 'del', onclick: () => { state.editGoal = m.id; render(); } }, 'Stjernemål'),
        h('button', { type: 'button', id: 'mdel-' + m.id, class: 'del' + (sure ? ' sure' : ''), 'aria-label': (sure ? 'Bekreft fjerning av ' : 'Fjern ') + m.name, onclick: () => {
          if (sure) { state.confirmDel = null; write(store.del('members', m.id)); return; }
          state.confirmDel = 'm:' + m.id; clearTimeout(confirmTimer); confirmTimer = setTimeout(() => { state.confirmDel = null; render(); }, 4000); render();
        } }, sure ? 'Bekreft' : 'Fjern'));
    }) : [h('li', { class: 'muted', text: state.ready ? 'Ingen er lagt til ennå. Skriv inn navn under, så kan oppgaver tildeles.' : '' })]));
  }

  function renderGoal() {
    const m = member(state.editGoal), box = $('goalEdit');
    if (!m || !m.child) { state.editGoal = null; box.hidden = true; box.replaceChildren(); return; }
    const same = box.dataset.for === m.id, og = $('g-goal'), or = $('g-reward');
    const gv = same && og ? og.value : String(m.starGoal || 20), rv = same && or ? or.value : (m.reward || '');
    box.dataset.for = m.id; box.hidden = false;
    box.replaceChildren(
      h('strong', { text: 'Stjernemål for ' + m.name }),
      h('label', { class: 'field num' }, 'Stjerner per uke', h('input', { type: 'number', id: 'g-goal', min: 1, max: 500, value: gv })),
      h('label', { class: 'field grow' }, 'Belønning når målet er nådd', h('input', { type: 'text', id: 'g-reward', maxLength: 80, value: rv, placeholder: 'F.eks. velge fredagsfilm' })),
      h('button', { type: 'button', id: 'g-save', class: 'btn primary', onclick: () => {
        const body = Object.assign({}, m, { starGoal: Math.min(500, Math.max(1, Math.round(Number($('g-goal').value) || 20))), reward: $('g-reward').value.trim() });
        delete body.id; state.editGoal = null; write(store.set('members', m.id, body)); render();
      } }, 'Lagre'),
      h('button', { type: 'button', id: 'g-cancel', class: 'btn', onclick: () => { state.editGoal = null; render(); } }, 'Avbryt'));
  }

  function renderKidLinks() {
    const kids = state.members.filter(m => m.child);
    $('kidLinks').hidden = !kids.length;
    $('kidLinks').replaceChildren(h('span', { class: 'kidlabel', text: 'Barnevisning:' }),
      ...kids.map(m => h('button', { type: 'button', id: 'go-' + m.id, class: 'chip go', onclick: () => setView(m.id) }, star(), m.name)));
  }

  function kidCard(t, day) {
    const done = isDone(t, day), s = stars(t);
    const steps = String(t.tips || '').split('\n').map(x => x.trim()).filter(Boolean);
    return h('article', { class: 'kcard' + (done ? ' done' : '') },
      h('div', { class: 'kbody' },
        h('h3', { text: t.title }),
        h('p', { class: 'kmeta', text: done ? 'Ferdig · +' + starWord(s) : (t.minutes ? 'ca. ' + t.minutes + ' min · ' : '') + starWord(s) }),
        !done && (state.claims[day] || {})[t.id] === state.view && h('button', { type: 'button', id: 'krel-' + t.id, class: 'del', style: 'align-self:flex-start', onclick: () => setClaim(t, day, '') }, 'Legg tilbake'),
        !done && steps.length > 0 && h('details', { class: 'tips', id: 'ktip-' + t.id, open: state.openTips.has(t.id), ontoggle: e => { if (e.target.open) state.openTips.add(t.id); else state.openTips.delete(t.id); } },
          h('summary', { text: 'Slik gjør du det' }), h('ol', null, steps.map(x => h('li', { text: x }))))),
      h('button', { type: 'button', id: 'kdone-' + t.id, class: 'kcheck', 'aria-pressed': String(done), 'aria-label': (done ? 'Angre: ' : 'Merk som ferdig: ') + t.title,
        onclick: () => { state.lastDone = done ? null : t.id; toggleDone(t, !done, day); } }, done && h('span', { class: 'ico', innerHTML: CHECK })),
      done && state.lastDone === t.id && h('div', { class: 'sticker', text: 'Glitrende!' }));
  }

  function renderKid(kid) {
    const day = iso(new Date());
    const list = state.tasks.filter(t => appliesOn(t, day) && eff(t, day) === kid.id);
    const open = state.tasks.filter(t => t.child && appliesOn(t, day) && !eff(t, day) && !isDone(t, day)).concat(bigPool(day).filter(t => t.child).slice(0, 3));
    const openCard = t => h('article', { class: 'kcard' },
      h('div', { class: 'kbody' }, h('h3', { text: t.title }), h('p', { class: 'kmeta', text: (t.minutes ? 'ca. ' + t.minutes + ' min · ' : '') + starWord(stars(t)) })),
      h('button', { type: 'button', id: 'ktake-' + t.id, class: 'btn primary', 'aria-label': 'Ta den: ' + t.title, onclick: () => setClaim(t, day, kid.id) }, 'Ta den'));
    const left = list.filter(t => !isDone(t, day)).length;
    const goal = Math.max(1, Number(kid.starGoal) || 20), got = weekStars(kid.id), pct = Math.min(100, Math.round(100 * got / goal));
    const sub = !list.length ? 'Du har ingen oppgaver i dag.' : !left ? 'Alt er gjort i dag. Glitrende!' : 'Du har ' + left + (left === 1 ? ' oppgave' : ' oppgaver') + ' igjen i dag.';
    const reward = got >= goal ? 'Målet er nådd!' + (kid.reward ? ' Du får: ' + kid.reward : '') : kid.reward ? 'Ved ' + goal + ' stjerner: ' + kid.reward : 'Spør en voksen hva du får ved ' + goal + ' stjerner.';
    $('kidView').replaceChildren(
      h('header', { class: 'kidhead' }, h('div', { class: 'kidin' },
        h('div', { class: 'kidtop' },
          h('div', null, h('h1', { text: 'Hei, ' + kid.name + '!' }), h('p', { class: 'kidsub', text: sub })),
          h('button', { type: 'button', id: 'kid-back', class: 'round', 'aria-label': 'Bytt til voksenvisning', onclick: () => setView(null) }, h('span', { class: 'ico', innerHTML: PEOPLE }))),
        h('div', { class: 'starcard' },
          h('div', { class: 'starrow' }, h('span', { text: 'Ukas stjerner' }), h('span', { class: 'starnum' }, got + ' av ' + goal, star())),
          h('div', { class: 'bar', role: 'img', 'aria-label': got + ' av ' + goal + ' stjerner' }, h('span', Object.assign({ style: 'width:' + pct + '%' }, pct === 0 || pct === 100 ? { 'data-zero': '' } : {}))),
          h('p', { class: 'muted small', text: reward })))),
      h('div', { class: 'checker kid', 'aria-hidden': 'true' }),
      h('div', { class: 'wrap' },
        h('h2', { text: 'Mine oppgaver i dag' }),
        list.length ? h('div', { class: 'kcards' }, list.map(t => kidCard(t, day))) : h('p', { class: 'empty', text: 'Ingen oppgaver er dine i dag ennå.' }),
        open.length > 0 && h('h2', { text: 'Ledige oppgaver – ta en!' }),
        open.length > 0 && h('div', { class: 'kcards' }, open.map(openCard))));
  }

  function render() {
    const a = document.activeElement, fid = a && a.id && !a.closest('form') ? a.id : null;
    const vm = member(state.view), kid = vm && vm.child ? vm : null;
    $('adultView').hidden = !!kid; $('topChecker').hidden = !!kid; $('kidView').hidden = !kid;
    if (kid) renderKid(kid); else $('kidView').replaceChildren();
    renderKidLinks(); renderGoal();
    renderWeek(); renderFilters(); renderDay(); renderCompare(); renderMembers();
    if (fid && $(fid) && document.activeElement !== $(fid)) $(fid).focus();
  }

  /* ---------- skjema og navigasjon ---------- */
  DAYS_LONG.forEach((name, i) => $('f-days').append(h('label', { class: 'check' }, h('input', { type: 'checkbox', class: 'cb', id: 'f-d' + (i + 1), value: String(i + 1) }), name)));
  $('f-repeat').addEventListener('change', e => { $('f-days').hidden = e.target.value !== 'days'; });
  $('f-kind').addEventListener('change', e => {
    const big = e.target.value === 'stor';
    $('f-every-wrap').hidden = !big; $('f-repeat-wrap').hidden = big; $('f-rot-wrap').hidden = big;
    $('f-days').hidden = big || $('f-repeat').value !== 'days';
    if (e.target.value === 'vane' && $('f-repeat').value === 'once') { $('f-repeat').value = 'daily'; }
  });

  $('taskForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('f-title').value.trim(); if (!title) return;
    const big = $('f-kind').value === 'stor', rep = big ? 'daily' : $('f-repeat').value;
    let days = [];
    if (rep === 'days') {
      days = [1, 2, 3, 4, 5, 6, 7].filter(n => $('f-d' + n).checked);
      if (!days.length) { toast('Velg minst én ukedag.'); return; }
    }
    write(store.set('tasks', store.newId(), {
      title, minutes: Math.max(0, Math.round(Number($('f-min').value) || 0)), kind: $('f-kind').value,
      days, date: rep === 'once' ? state.sel : null, child: $('f-child').checked, assignee: big ? null : ($('f-who').value || null), tips: $('f-tips').value.trim(), created: Date.now(),
      rot: big ? [] : $('f-rot').value.split('').map(Number), every: big ? Math.min(52, Math.max(1, Math.round(Number($('f-every').value) || 8))) : null, order: Date.now()
    }));
    $('f-tips').value = ''; $('f-title').value = ''; $('f-title').focus();
  });

  $('memberForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('m-name').value.trim(); if (!name) return;
    write(store.set('members', store.newId(), { name, child: $('m-child').checked, created: Date.now() }));
    $('m-name').value = ''; $('m-child').checked = false; $('m-name').focus();
  });

  function shiftWeek(n) {
    const sel = parse(state.sel); sel.setDate(sel.getDate() + 7 * n);
    state.sel = iso(sel); state.weekStart = monday(sel); render();
  }
  $('prevWeek').addEventListener('click', () => shiftWeek(-1));
  $('nextWeek').addEventListener('click', () => shiftWeek(1));
  $('goToday').addEventListener('click', () => { const t = new Date(); state.sel = iso(t); state.weekStart = monday(t); render(); });

  /* ---------- start ---------- */
  store = { newId: () => '', set: () => Promise.reject({}), del: () => Promise.reject({}) };
  render();
  (window.claude && window.claude.use ? window.claude.use('db').catch(() => null) : Promise.resolve(null)).then(db => {
    store = db ? makeDb(db) : makeLocal();
    store.start();
  });
})();
</script>
