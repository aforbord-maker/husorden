<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Husorden – illustrasjoner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Bebas+Neue&amp;family=Figtree:wght@400;600;800&amp;display=swap">
<style>
body{margin:0}
.wallpaper{background-color:#FBF7F0;background-image:radial-gradient(#F7A1B5 1.6px, transparent 1.8px),radial-gradient(#8EE3C8 1.6px, transparent 1.8px);background-size:36px 36px,36px 36px;background-position:0 0,18px 18px}
</style>
</helmet>
<div class="wallpaper" style="width: 1440px; height: 900px; box-sizing: border-box; color: #1A2227; font-family: Figtree, system-ui, sans-serif; padding: 56px 120px; display: flex; flex-direction: column; gap: 40px; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 56px; letter-spacing: 0.02em">OPPGAVEILLUSTRASJONER</h1>
    <p style="margin: 0; font-size: 19px; max-width: 980px; line-height: 1.45">Laget i ChatGPT etter HUSORDEN-skiltet: skråstilt skiltramme med mint kant, stjerner i hjørnet og glitter – enkle og lette å kjenne igjen, også i små kort. Velg motiv i Tweaks på illustrasjonskomponenten.</p>
  </header>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 40px; justify-items: center">
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 240px"><dc-import name="Ill" motiv="vask" hint-size="240px,240px"></dc-import></div>
      <figcaption style="font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.06em">Sette på en vask</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 240px"><dc-import name="Ill" motiv="klesvask" hint-size="240px,240px"></dc-import></div>
      <figcaption style="font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.06em">Klesvask</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 240px"><dc-import name="Ill" motiv="oppvask" hint-size="240px,240px"></dc-import></div>
      <figcaption style="font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.06em">Oppvask</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 240px"><dc-import name="Ill" motiv="seng" hint-size="240px,240px"></dc-import></div>
      <figcaption style="font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.06em">Re opp sengen</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 240px"><dc-import name="Ill" motiv="sopla" hint-size="240px,240px"></dc-import></div>
      <figcaption style="font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.06em">Ta ut søpla</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 240px"><dc-import name="Ill" motiv="plante" hint-size="240px,240px"></dc-import></div>
      <figcaption style="font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.06em">Vanne plantene</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 240px"><dc-import name="Ill" motiv="stovsuger" hint-size="240px,240px"></dc-import></div>
      <figcaption style="font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.06em">Støvsuge</figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
