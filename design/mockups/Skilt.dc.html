<script type="text/x-dc" data-dc-script data-props='{"tekst":{"editor":"text","default":"HUSORDEN"},"undertekst":{"editor":"text","default":"— VASK • RYDD • GLITRE —"},"visPil":{"editor":"boolean","default":true},"$preview":{"width":1040,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const tekst = String(this.props.tekst ?? 'HUSORDEN').toUpperCase();
    const undertekst = this.props.undertekst ?? '— VASK • RYDD • GLITRE —';
    const n = Math.max(tekst.length, 1);
    const fs = n > 9 ? Math.round(200 * 9 / n) : 200;
    const tl = Math.min(760, Math.round(n * fs * 0.47));
    return {
      tekst, undertekst, fs, tl,
      harUndertekst: !!String(undertekst).trim(),
      visPil: this.props.visPil ?? true,
      label: tekst + (String(undertekst).trim() ? ' – ' + undertekst : '')
    };
  }
}
</script>
